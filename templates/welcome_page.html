<html>
    <head>
        <title> Wetter Seite</title>
        <style>
            body {
                background-color: rgba(228, 234, 242);
                margin: 0;
                padding: 0;
                font-size: 22px;
                padding: 45px;
                background-image: url("/static/images/header.png");
                background-repeat: no-repeat;
                background-position: 0px -350px;
                      
            }
            
            .header {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            
            h3 { /*WetterVohersage */
                font-family: 'Roboto', sans-serif;
                color: rgb(252, 251, 250);
                font-size: 25px;
                margin-top: -40;
                margin-left: -30px;
            }
            /* Der Style von h4 habe ich aus glassmorphism.com kopiert*/
            h4 {
                /* Disposition et alignement des éléments */

                justify-content: space-between;
                padding: 12px 20px;
                margin-top: 10px;
                
                /* Bords arrondis */
                border-radius: 12px;
                
                /* Fond dégradé semi-transparent */
                background: linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    rgba(255, 255, 255, 0.05) 100%
                );
                
                /* Effet de flou d'arrière-plan (Glassmorphic) */
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px); /* Compatibilité Safari */

                /* Bordure très subtile pour accentuer la vitre */
                border: 1px solid rgba(255, 255, 255, 0.18);
                
                /* Ombre douce sous la carte */
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);

                /* Stylisation du texte */
                color: #ffffff;
                font-family: system-ui, -apple-system, sans-serif;
                font-weight: 400;
            
            }
            p{
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                font-size: 10px;
                margin-left: -30px;
                margin-top: 250px;
            }
            .Welt_bild{
                display: block;
                margin-left: auto;
                margin-right: auto;
                margin-top: 50px;
            
            }
            .wetter_anzeigen{
                margin-top: 20px;
                margin-left: 35px;
                background-color: rgb(141, 126, 126);
                color: #ffffff;
                top: 70%;
            }

        
            
        
        </style>
    </head>


    
    <body>
        <h3>WetterVorhersage</h3> 
        <div class="header">

        <form method="get" onsubmit="getName(); return false;">
            <input type="text" id="name"><br>
            <button class= "wetter_anzeigen" type="submit">Wetter anzeigen</button>
        </form>

        <script>
            function getName() {
                let valeur = document.getElementById("name").value;

                let wetter_link =
                    `http://127.0.0.1:5000/wetter?ville=${encodeURIComponent(valeur)}`;

                window.location.href = wetter_link;
            }
        </script>


            
            <h4><span>📍 {{hannover_stadt}}, {{hannover_land}}</span> <span>     ☁️ {{hannover_temperatur}}°C</span></h4>
            <br>
            
        </div>
        <img class="Welt_bild" src="{{ url_for('static', filename='images/welt_tmax_tag0.png') }}" alt="Welt Karte" height="350" width="750"><br>
