
<! Dise Seite ist die erste Seite. Hier wird der Benutzer gefragt, der
Name einer Stadt einzugeben.>

<html>
    <head>
        <title> Wetter Seite</title>
        <style>
            body {
                background-color: aliceblue;
                margin: 0;
                padding: 0;
                
            }
            
            .header {
                background-image: url("/static/images/header.png");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                padding: 55px;
            }

            
            h3 { /*WetterVohersage */
                font-family: 'Roboto', sans-serif;
                color: rgb(250, 250, 252);
                font-size: 25px;
            }
            .search {
                align-items: center;
            }
        
            
            



        </style>
    </head>
    <body>
        <div class="header">
            <h3>WetterVorhersage</h3>
            <form method="get">
            <input class="search" type="text" id="name">
            </form>
            <button onclick="getName()">Wetter anzeigen</button>    
        
            <script>
                function getName() {
                    let valeur = document.getElementById("name").value;
                    let wetter_link = `http://127.0.0.1:5000/wetter?ville=${encodeURIComponent(valeur)}`;

                    window.location.href = wetter_link
                }
            </script>
            
        </div>
        
        

        
        
        <img src="{{ url_for('static', filename='images/welt_tmax_tag0.png') }}" alt="Welt Karte" height="300" width="700"><br>
        <p>
            Planst du gerade einen Urlaub und machst dir Gedanken über das Wetter? Wir haben gute Nachrichten <br>
            für dich! Gib einfach den Namen der Stadt ein, in die du reisen möchtest, und erfahre, wie das <br>
            Wetter dort in den nächsten sieben Tagen wird.
        </p><br>

        
        

        

       

    </body>
</html>
